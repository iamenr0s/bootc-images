name: rescan-published
on:
  schedule:
    - cron: "45 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # same source of truth as build.yml: one entry per images/<distro>/<version>/env
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: |
          images="$(find images -mindepth 3 -maxdepth 3 -name env | sort \
            | jq -Rnc '[inputs | split("/") | {distro: .[1], version: .[2]}]')"
          echo "images=${images}" >> "${GITHUB_OUTPUT}"

  # Docker Hub and Quay hold the same digests (one build pushed to both), so
  # scanning Quay covers both registries.
  rescan:
    needs: matrix
    name: rescan (${{ matrix.image.distro }} ${{ matrix.image.version }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.matrix.outputs.images) }}
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      DISTRO: ${{ matrix.image.distro }}
      VERSION: ${{ matrix.image.version }}
      ARCH: ${{ matrix.arch }}
      REF: quay.io/${{ vars.QUAY_ORG }}/${{ matrix.image.distro }}-hardened-bootc:${{ matrix.image.version }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install scanners
        env:
          GH_TOKEN: ${{ github.token }}
        run: sudo --preserve-env=GH_TOKEN scripts/install-scanners.sh

      - name: Scan published image
        id: scan
        continue-on-error: true
        run: |
          grype "registry:${REF}" --platform "linux/${ARCH}" \
            --config policies/grype.yaml --fail-on high --only-fixed \
            -o json > grype.json

      # Shields endpoint JSON for the README table (amd64 leg only; one badge
      # per distro/version). .matches is already the gate's population.
      - name: Generate CVE badge JSON
        if: matrix.arch == 'amd64'
        run: |
          jq -e . grype.json >/dev/null 2>&1 || { echo "no valid grype report; keeping previous badge"; exit 0; }
          crit=$(jq '[.matches[]? | select(.vulnerability.severity == "Critical")] | length' grype.json)
          high=$(jq '[.matches[]? | select(.vulnerability.severity == "High")] | length' grype.json)
          med=$(jq '[.matches[]? | select(.vulnerability.severity == "Medium")] | length' grype.json)
          total=$(jq '.matches | length' grype.json)
          if [ "${total}" -eq 0 ]; then
            msg="0 fixable"; color="brightgreen"
          else
            msg="${total} fixable"
            if [ $((crit + high)) -gt 0 ]; then color="red"
            elif [ "${med}" -gt 0 ]; then color="orange"
            else color="yellow"; fi
          fi
          mkdir -p badge
          jq -n --arg msg "${msg}" --arg color "${color}" \
            '{schemaVersion: 1, label: "CVEs", message: $msg, color: $color}' \
            > "badge/cve-${DISTRO}-${VERSION}.json"

      - name: Upload badge artifact
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cve-badge-${{ matrix.image.distro }}-${{ matrix.image.version }}
          path: badge/
          if-no-files-found: ignore

      - name: Open issue on new findings
        if: steps.scan.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let report = {};
            try {
              report = JSON.parse(fs.readFileSync('grype.json', 'utf8'));
            } catch (e) {
              core.warning(`grype failed without a report (registry/network error?): ${e}`);
              return;
            }
            const vulns = (report.matches || [])
              .filter(m => ['High', 'Critical'].includes(m.vulnerability.severity))
              .map(m => `- ${m.vulnerability.id} (${m.vulnerability.severity}) in ${m.artifact.name} ${m.artifact.version}`)
              .join('\n');
            if (!vulns) return;  // scan failed for a non-finding reason
            // registry- and arch-agnostic title: one issue per distro+version
            const title = `CVEs found in ${process.env.DISTRO}-hardened-bootc:${process.env.VERSION}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'security'
            });
            if (!open.data.some(i => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ['security'],
                body: `Fixable High/Critical vulnerabilities detected (${process.env.REF}):\n\n${vulns}\n\nThe nightly rebuild should resolve these; investigate if they persist. If a fix isn't installable from the distro repos, add a reasoned, dated ignore to policies/grype.yaml.`
              });
            }

  # Single commit for all badge files on the orphan "badges" branch (never
  # main: pushes to main trigger build.yml). Committing on top of the branch
  # preserves files owned by quay-pulls-badge.yml.
  publish-badges:
    needs: rescan
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: badges
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cve-badge-*
          merge-multiple: true
          path: badges/
      - name: Commit updated badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/
          git diff --cached --quiet && { echo "badges unchanged"; exit 0; }
          git commit -m "chore: update CVE badges"
          git push origin badges || { git pull --rebase origin badges && git push origin badges; }
