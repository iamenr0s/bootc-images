# Grype policy: gate builds on fixable High/Critical findings.
# Every ignore needs a reason and a review date; prune when the date passes.
check-for-app-update: false
only-fixed: true
fail-on-severity: high
ignore:
  # Go modules compiled into distro-packaged binaries (podman, skopeo, quadlet, ...).
  # Everything under /usr is RPM-owned and only the distro can rebuild it; trivy
  # skips language packages inside OS-package files for the same reason. The
  # RPM itself is still scanned (and gated) as an OS package.
  - package: { type: go-module, location: "/usr/**" }
    reason: "Go module inside an RPM-owned binary; fix only via a distro rebuild. Review 2026-10-25."

  # Kernel found by grype's binary cataloger (vmlinuz), matched against NVD CPE
  # ranges instead of distro advisories. The kernel RPM (kernel-core) is still
  # scanned and gated as an OS package; the binary match is a noisy duplicate
  # (e.g. CVE-2020-27815, fixed in 5.10.4, flagged on Fedora 44's 7.2.7 kernel).
  - package: { type: linux-kernel, location: "/usr/lib/modules/**" }
    reason: "vmlinuz binary match via NVD CPE; kernel RPM is gated via distro advisories. Review 2026-10-25."

  # CentOS Stream 10: grype's fix data uses RHEL's point-release scheme (el10_N),
  # which Stream packages never carry. Verified 2026-09-25: `dnf check-update`
  # against the live Stream 10 repos reports no updates, so each package below is
  # already the newest published. Same class as docker-hardened-images' policy.
  - vulnerability: CVE-2026-44432
    package: { name: python3-urllib3 }
    reason: "CentOS Stream 10 el10_N mismatch: 1.26.19-4.el10 is newest on mirror (grype wants 0:1.26.19-4.el10_2). Review 2026-10-25."
  - vulnerability: CVE-2026-63382
    package: { name: libevent }
    reason: "CentOS Stream 10 el10_N mismatch: 2.1.13-1.el10 is newest on mirror (grype wants 0:2.1.13-1.el10_2). Review 2026-10-25."
